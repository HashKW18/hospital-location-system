# MySQL Profile Configuration
# Activate via: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or set environment variables: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.h2.console.enabled=false
