# Hospital Location & Patient Information System
# Default configuration (H2 in-memory mode for instant plug-and-play testing)

server.port=8080
spring.application.name=hospital-location-system

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 In-Memory Database (Default)
spring.datasource.url=jdbc:h2:mem:hospital_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=9a67c4e59b6348b1a52e729a6e3b5e4c8f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c
app.jwt.expiration-ms=86400000

# File Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
